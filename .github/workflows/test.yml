name: build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Compile
        run: go build
      - name: Test
        run: go test ./...
      # The acceptance test harness is a separate module, so it is not covered
      # by the steps above.
      - name: Compile acceptance test harness
        run: go build ./...
        working-directory: test
      - name: Vet acceptance test harness
        run: go vet ./...
        working-directory: test
